<!DOCTYPE html>
<html lang="en">
	<script type="application/ld+json">
		{
		"@context": "https://schema.org",
		"@type": "Place",
		"name": "CGS Cafe Location",
		"url": "https://cgscafe.in/find-us",
  		"logo": "https://cgscafe.in/images/cgs-logo.webp",
		"image": "https://cgscafe.in/images/cgs-preview.webp",
		"description": "CGS Cafe in Scheme No 103, Indore offering premium coffee, grill items, mocktail shots and refreshing beverages. A modern boutique cafe experience. Jumpstart Your Mood.",
		"address": {
			"@type": "PostalAddress",
			"streetAddress": "Scheme No 103",
			"addressLocality": "Indore",
			"addressRegion": "MP",
			"postalCode": "452012",
			"addressCountry": "IN"
		},
		"areaServed": {
			"@type": "City",
			"name": "Indore"
		},
		"geo": {
			"@type": "GeoCoordinates",
			"latitude": 22.676278, 
			"longitude": 75.841528
		},
		"telephone": "+91-8390540094",
		"openingHours": "Mo-Su 08:00-23:00",
		"servesCuisine": ["Cafe", "Coffee", "Fast Food", "Beverages"],
		"priceRange": "₹₹"
		}
	</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">	
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/css/main.css">
    <link href="/fonts/google-fonts.css" rel="stylesheet">
	<meta name="theme-color" content="#3b2a1a">
	<meta name="google-site-verification" content="fd40eee476e539a8" />

	<title>Find CGS Cafe | Location in Indore</title>
	<meta name="description" content="Locate CGS Cafe in Scheme No 103, Indore. Get directions and plan your visit.">
	<link rel="canonical" href="https://cgscafe.in/find-us/">

	<meta property="og:title" content="Find CGS Cafe">
	<meta property="og:description" content="Visit CGS Cafe in Indore today.">
	<meta property="og:url" content="https://cgscafe.in/find-us/">
	<meta property="og:image" content="https://cgscafe.in/images/cgs-preview.webp">

	<!-- Dependencies First -->
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
	<script src="../js/supabase-config.js"></script>
	
	<!-- Global Scripts (Load these before admin.js so they are ready) -->
	<script src="../js/custom.js"></script>
	<script src="../js/components.js"></script> <!-- Updates the UI -->
	<script src="../js/animations.js"></script>
</head>
<body>
   <!-- Header Section -->
	<header id="header"></header>
	<section class="content-section" id="find-us">
		<div class="reveal section-header">
			<span class="gold-divider mx-auto mb-6"></span>
			<div class="section-label font-display text-4xl text-gold">Find Us</div>
		</div>
		
		<div class="reveal container">
			<div class="contact-grid">
				<div class="contact-info">
					<p class="font-cormorant text-lg text-foreground/80 italic leading-relaxed mb-6">
						Drop by for a smooth coffee, comforting bites, or a refreshing pause — we’re always ready to welcome you.
					</p>
					<div class="mt-10">
						<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6 text-center">
							<!-- Location Tile -->
							<a id="map-link" href="#" target="_blank" rel="noopener noreferrer">
							    <div class="info-card">
							        <div class="info-icon">📍</div>
							        <div class="info-title">Location</div>
							        <div class="info-text" id="display-short-address">Loading...</div>
							    </div>
							</a>
							
							<!-- Hours Tile -->
							<div class="info-card">
							    <div class="info-icon">⏰</div>
							    <div class="info-title">Hours</div>
							    <div class="info-text" id="display-timings">Loading...</div>
							</div>
							
							<!-- Call Tile -->
							<a id="call-link" href="#" title="Click to Call">
							    <div class="info-card">
							        <div class="info-icon">📞</div>
							        <div class="info-title">Call</div>
							        <div class="info-text" id="display-phone">Loading...</div>
							    </div>
							</a>
							
							<!-- WhatsApp Tile -->
							<a id="whatsapp-link" href="#" target="_blank" title="Click to Chat">
							    <div class="info-card">
							        <div class="info-icon">💬</div>
							        <div class="info-title">WhatsApp</div>
							        <div class="info-text">Start Chat</div>
							    </div>
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
   <!-- Footer Section -->
   <footer class="footer" id="footer"></footer>
	<!-- Miscellaneous (Top-Bottom scrolling, WhatsApp Chat) -->
	<div id="preloader"></div>
</body>
</html>
