		<script>
    // Helper to convert category names into clean tab slugs
    function slugify(text) {
        return (text || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    // Direct and bulletproof Supabase client initializer
    async function getSupabaseClient() {
        if (window.supabaseClient && typeof window.supabaseClient.from === 'function') {
            return window.supabaseClient;
        }
        if (window.supabase && typeof window.supabase.from === 'function') {
            return window.supabase;
        }

        if (typeof supabase !== 'undefined' && window.currentConfig && window.currentConfig.url && window.currentConfig.anonKey) {
            try {
                const client = supabase.createClient(window.currentConfig.url, window.currentConfig.anonKey);
                window.supabaseClient = client;
                return client;
            } catch (e) {
                console.error("Direct Supabase initialization failed:", e);
            }
        }
        return null;
    }

    // Safe menu loader querying your live menu table
    async function loadMenuFromSupabase() {
        // Directly leverage the centralized fetch helper from environment.js
        if (typeof window.fetchMasterMenuFromDatabase === 'function') {
            return await window.fetchMasterMenuFromDatabase();
        }
        
        console.error("fetchMasterMenuFromDatabase is not defined in environment.js.");
        return { categories: [] };
    }

    // Fully dynamic loader for categories, double-bordered thumbnail tabs, and items
    async function initDynamicSignaturePicks() {
        try {
            const masterDb = await loadMenuFromSupabase();
            if (!masterDb || !masterDb.categories) return;

            const tabsContainer = document.getElementById('dynamic-menu-tabs');
            const contentsContainer = document.getElementById('dynamic-tab-contents');
            
            if (!tabsContainer || !contentsContainer) return;

            tabsContainer.innerHTML = '';
            contentsContainer.innerHTML = '';

            // Apply horizontal swipeable scroller styling to the tabs container dynamically
            tabsContainer.className = 'category-thumbnails-slider';

            let isFirstTab = true;

            masterDb.categories.forEach((category, catIndex) => {
                if (category.hidden) return;

                const items = category.items || [];
                if (items.length === 0) return;

                // PRE-CHECK: Verify if the category has at least one visible, featured item
                const hasFeaturedItems = items.some(item => !item.hidden && item.featured);
                if (!hasFeaturedItems) return; // Skip this category completely if no featured items exist

                const catName = category.subCategoryName || category.name || `Category ${catIndex + 1}`;
                const catSlug = slugify(catName);

                // Extract image with an exhaustive fallback check across all possible property variations
            let categoryImage = '';
            
            // 1. Look for a valid image on any featured item in this category
            const itemWithImage = items.find(item => !item.hidden && item.featured && (item.image_url || item.image_path || item.imageUrl || item.imagePath || item.image || item.img));
            
            if (itemWithImage) {
                categoryImage = itemWithImage.image_url || itemWithImage.image_path || itemWithImage.imageUrl || itemWithImage.imagePath || itemWithImage.image || itemWithImage.img;
            } 
            
            // 2. If still empty, check if the category object itself has an image property
            if (!categoryImage) {
                categoryImage = category.image_url || category.image_path || category.imageUrl || category.imagePath || category.image || category.img;
            }

                // 1. Create Double-Bordered Square Thumbnail Tab Element
                const thumbItem = document.createElement('div');
                thumbItem.className = `category-thumb-item ${isFirstTab ? 'active' : ''}`;
                thumbItem.setAttribute('data-tab', catSlug);
                thumbItem.innerHTML = `
                    <div class="category-thumb-box">
                        <img src="${categoryImage}" alt="${catName}" loading="lazy">
                    </div>
                    <span class="category-thumb-name">${catName}</span>
                `;

                // Tab Click Interactivity
                thumbItem.addEventListener('click', () => {
                    document.querySelectorAll('.category-thumb-item').forEach(el => el.classList.remove('active'));
                    thumbItem.classList.add('active');

                    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                    const targetContent = document.getElementById(`tab-${catSlug}`);
                    if (targetContent) targetContent.classList.add('active');
                });

                tabsContainer.appendChild(thumbItem);

                // 2. Create Tab Content Panel dynamically
                const tabContent = document.createElement('div');
                tabContent.className = `tab-content ${isFirstTab ? 'active' : ''}`;
                tabContent.id = `tab-${catSlug}`;

                const productGrid = document.createElement('div');
                productGrid.className = 'product-grid';

                // 3. Populate product cards inside the category grid
                items.forEach(item => {
                    if (item.hidden || !item.featured) return;

                    const card = document.createElement('div');
                    card.className = 'product-card';

                    const imageUrl = item.image_url || '';
                    const itemName = item.name || '';
                    const itemDesc = item.description || '';
                    const showPrices = item.price;
                    const showQty    = item.qty;
                    const itemMeta = item.qty || item.price ? `${item.qty || ''} ${item.price ? '₹' + item.price : ''}`.trim() : '';

                    card.innerHTML = `
                        <div class="product-card__image">
                            <img src="${imageUrl}" alt="${itemName}" loading="lazy">
                            <span class="product-card__badge">&#10022; Signature</span>
                        </div>
                        <div class="product-card__info">
                            <h3 class="product-card__name">${itemName}</h3>
                            ${itemDesc ? `<p class="product-card__desc">${itemDesc}</p>` : ''}
                            <span class="hidden">
                                ${(showQty && item.qty) ? `<span class="menu-item__meta">${item.qty}</span>` : ''}
                                ${(showPrices && item.price) ? `<span class="menu-item__meta">${item.price}</span>` : ''}
                            </span>
                        </div>
                    `;
                    
                    card.querySelector('.product-card__image img').addEventListener('click', () => {
                        openLightbox(imageUrl, itemName);
                    });
                    productGrid.appendChild(card);
                });

                tabContent.appendChild(productGrid);
                contentsContainer.appendChild(tabContent);

                // Set the first actually rendered tab as active
                if (isFirstTab) {
                    isFirstTab = false;
                }
            });

        } catch (err) {
            console.error("Failed to dynamically load signature tabs:", err);
        }
    }
    
    document.addEventListener("DOMContentLoaded", initDynamicSignaturePicks);
</script>
