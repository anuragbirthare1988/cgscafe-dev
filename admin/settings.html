e<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CGS Site Settings</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../js/supabase-config.js"></script>
    <style>
        :root {
            --bg-outer: #f4eae1; --bg-card: #282220; --text-gold: #dabba0;
            --brand-orange: #d17533; --input-bg: #1e1917; --input-border: #3a3230;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-outer); font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .calc-container { width: 100%; max-width: 460px; }
        .calc-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--text-gold); text-align: center; margin-bottom: 1.5rem; }
        .compact-card { background-color: var(--bg-card); border-radius: 8px; padding: 1.5rem; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; gap: 1rem; }
        .field-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .compact-label { color: var(--text-gold); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; }
        .compact-control { width: 100%; background-color: var(--input-bg); border: 1px solid var(--input-border); color: #ffffff; padding: 0.65rem 0.85rem; border-radius: 6px; font-size: 0.95rem; }
        .compact-control:focus { outline: none; border-color: var(--brand-orange); }
        button { margin-top: 0.5rem; background-color: var(--brand-orange); color: white; border: none; padding: 0.8rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #555; cursor: not-allowed; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="calc-container">
        <h1 class="calc-title">Site Settings</h1>
        <form id="settings-form" class="compact-card">
            <!-- ADDRESS FIELDS -->
            <div class="field-group">
                <label class="compact-label">Address Line 1</label>
                <input type="text" id="addr_line1" class="compact-control" required>
            </div>
            <div class="field-group">
                <label class="compact-label">Address Line 2</label>
                <input type="text" id="addr_line2" class="compact-control" required>
            </div>
            <div class="field-group">
                <label class="compact-label">Short Address (For Header/Quick View)</label>
                <input type="text" id="short_address" class="compact-control" placeholder="e.g. Scheme 59, Indore" required>
            </div>
            <div class="field-group">
                <label class="compact-label">City</label>
                <input type="text" id="addr_line3" class="compact-control" required>
            </div>
        
            <!-- NEW FIELDS -->
            <div class="field-group">
                <label class="compact-label">State</label>
                <select id="state" class="compact-control" required>
                    <option value="">Select State</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                </select>
            </div>
            <div class="field-group">
                <label class="compact-label">ZIP Code</label>
                <input type="text" id="zip" class="compact-control" 
                       pattern="\d{6}" maxlength="6" 
                       placeholder="6-digit code" required>
            </div>
            <div class="field-group">
                <label class="compact-label">Google Maps URL</label>
                <input type="url" id="maps_url" class="compact-control" placeholder="https://maps.app.goo.gl/...">
            </div>
            <div class="field-group">
                <label class="compact-label">Phone</label>
                <input type="text" id="phone" class="compact-control" required>
            </div>
            <div class="field-group">
                <label class="compact-label">WhatsApp Number (with country code, no symbols)</label>
                <input type="text" id="whatsapp_number" class="compact-control" placeholder="918390540094">
            </div>
            <div class="setting-field">
                <label for="whatsapp_message">WhatsApp Greeting Message:</label>
                <textarea id="whatsapp_message" name="whatsapp_message" rows="4" placeholder="Hi!&#10;I just visited your website and want to connect to explore CGS..."></textarea>
            </div>
            <div class="field-group">
                <label class="compact-label">Business Timings</label>
                <input type="text" id="timings" class="compact-control" placeholder="e.g. 10:00 AM - 11:00 PM" required>
            </div>
            
            <button type="submit" id="submit-btn" disabled>Update Settings</button>
        </form>

        <script>
            const form = document.getElementById('settings-form');
            const submitBtn = document.getElementById('submit-btn');
            let initialValues = {};
        
            async function loadSettings() {
                const { data } = await defaultSupabaseClient.from('site_settings').select('*');
                if (data) {
                    data.forEach(item => {
                        const el = document.getElementById(item.key);
                        if (el) {
                            el.value = item.value;
                            initialValues[item.key] = item.value;
                        }
                    });
                    validateForm();
                }
            }
        
            function validateForm() {
                const inputs = form.querySelectorAll('input, select');
                let allFilled = true;
                let hasChanged = false;
        
                inputs.forEach(input => {
                    if (!input.value.trim()) allFilled = false;
                    if (input.value !== (initialValues[input.id] || "")) hasChanged = true;
                });
        
                const zipVal = document.getElementById('zip').value;
                const zipValid = /^\d{6}$/.test(zipVal);
        
                submitBtn.disabled = !(allFilled && hasChanged && zipValid);
            }
        
            form.addEventListener('input', validateForm);
            form.addEventListener('change', validateForm);
        
            form.onsubmit = async (e) => {
                e.preventDefault();
                if (!confirm("Are you sure you want to update these settings?")) return;
        
                // UPDATED: All fields are now included here
                const fields = [
                    'addr_line1', 
                    'addr_line2', 
                    'addr_line3', 
                    'state', 
                    'zip', 
                    'phone', 
                    'timings', 
                    'short_address',
                    'maps_url',
                    'whatsapp_number'
                ];
        
                for (const key of fields) {
                    const el = document.getElementById(key);
                    if (el) {
                        await defaultSupabaseClient
                            .from('site_settings')
                            .upsert({ key: key, value: el.value }, { onConflict: 'key' });
                    }
                }
                alert("Settings updated successfully!");
                location.reload();
            };
        
            window.onload = loadSettings;
        </script>
</body>
</html>
