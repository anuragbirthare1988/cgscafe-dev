e<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CGS Site Settings</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../js/supabase-config.js"></script>
    <style>
        :root {
            --bg-outer: #f4eae1; --bg-card: #282220; --text-gold: #dabba0;
            --brand-orange: #d17533; --input-bg: #1e1917; --input-border: #3a3230;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-outer); 
            font-family: 'Montserrat', sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* Fixed Header Area */
        .header-container { 
            padding: 20px; 
            text-align: center; 
            background: var(--bg-outer); 
            z-index: 10; 
        }
        .calc-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: #444; }

        /* Scrollable Grid Area */
        .scroll-wrapper { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }
        .calc-container { width: 100%; max-width: 900px; }
        
        .compact-card { 
            background-color: var(--bg-card); 
            border-radius: 8px; 
            padding: 1.5rem; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 1rem; 
        }
        
        /* Spanning and Spacing */
        .full-width { grid-column: span 3; }
        
        .field-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .compact-label { color: var(--text-gold); font-size: 0.72rem; text-transform: uppercase; }
        .compact-control { width: 100%; background-color: var(--input-bg); border: 1px solid var(--input-border); color: #fff; padding: 0.65rem; border-radius: 6px; }
        
        button { grid-column: span 3; background-color: var(--brand-orange); color: white; border: none; padding: 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #555; cursor: not-allowed; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="header-container">
        <h1 class="calc-title">Site Settings</h1>
    </div>
    <div class="scroll-wrapper">
        <form id="settings-form" class="compact-card">
            <!-- ADDRESS FIELDS -->
            <div class="field-group">
                <label class="compact-label" id="addr_line1">Address Line 1</label>
                <input type="text" id="addr_line1" class="compact-control" required>
            </div>
            <div class="field-group">
                <label class="compact-label" id="addr_line2">Address Line 2</label>
                <input type="text" id="addr_line2" class="compact-control" required>
            </div>
            <div class="field-group">
                <label class="compact-label" id="short_address">Short Address (For Header/Quick View)</label>
                <input type="text" id="short_address" class="compact-control" placeholder="e.g. Scheme 59, Indore" required>
            </div>
            <div class="field-group">
                <label class="compact-label" id="addr_line3">City</label>
                <input type="text" id="addr_line3" class="compact-control" required>
            </div>
        
            <!-- NEW FIELDS -->
            <div class="field-group">
                <label class="compact-label" id="state">State</label>
                <select id="state" class="compact-control" required>
                    <option value="">Select State</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                </select>
            </div>
            <div class="field-group">
                <label class="compact-label" id="zip">ZIP Code</label>
                <input type="text" id="zip" class="compact-control" 
                       pattern="\d{6}" maxlength="6" 
                       placeholder="6-digit code" required>
            </div>
            <div class="field-group">
                <label class="compact-label" id="maps_url">Google Maps URL</label>
                <input type="url" id="maps_url" class="compact-control" placeholder="https://maps.app.goo.gl/...">
            </div>
            <div class="field-group">
                <label class="compact-label" id="phone">Phone</label>
                <input type="text" id="phone" class="compact-control" required>
            </div>
            <div class="field-group">
                <label class="compact-label" id="whatsapp_number">WhatsApp Number (with country code, no symbols)</label>
                <input type="text" id="whatsapp_number" class="compact-control" placeholder="918390540094">
            </div>
            <div class="setting-field">
                <label class="compact-label" for="whatsapp_message">WhatsApp Greeting Message:</label>
                <textarea id="whatsapp_message" class="compact-control" name="whatsapp_message" rows="4" placeholder="Hi!&#10;I just visited your website and want to connect to explore CGS..."></textarea>
            </div>
            <div class="field-group">
                <label class="compact-label" id="timings">Business Timings</label>
                <input type="text" id="timings" class="compact-control" placeholder="e.g. 10:00 AM - 11:00 PM" required>
            </div>
            
            <button type="submit" id="submit-btn" disabled>Update Settings</button>
        </form>
    </div>

        <script>
            const form = document.getElementById('settings-form');
            const submitBtn = document.getElementById('submit-btn');
            let initialValues = {};
        
            async function loadSettings() {
                const { data } = await defaultSupabaseClient.from('site_settings').select('*');
                if (data) {
                    data.forEach(item => {
                        const el = document.getElementById(item.key);
                        if (el) {
                            el.value = item.value;
                            initialValues[item.key] = item.value;
                        }
                    });
                    validateForm();
                }
            }
        
            function validateForm() {
                const inputs = form.querySelectorAll('input, select');
                let allFilled = true;
                let hasChanged = false;
        
                inputs.forEach(input => {
                    if (!input.value.trim()) allFilled = false;
                    if (input.value !== (initialValues[input.id] || "")) hasChanged = true;
                });
        
                const zipVal = document.getElementById('zip').value;
                const zipValid = /^\d{6}$/.test(zipVal);
        
                submitBtn.disabled = !(allFilled && hasChanged && zipValid);
            }
        
            form.addEventListener('input', validateForm);
            form.addEventListener('change', validateForm);
        
            form.onsubmit = async (e) => {
                e.preventDefault();
                if (!confirm("Are you sure you want to update these settings?")) return;
        
                // Complete list of all fields to be saved
                const fields = [
                    'addr_line1', 
                    'addr_line2', 
                    'addr_line3', 
                    'state', 
                    'zip', 
                    'phone', 
                    'timings', 
                    'short_address',
                    'maps_url',
                    'whatsapp_number',
                    'whatsapp_message'
                ];
        
                for (const key of fields) {
                    const el = document.getElementById(key);
                    if (el) {
                        await defaultSupabaseClient
                            .from('site_settings')
                            .upsert({ key: key, value: el.value }, { onConflict: 'key' });
                    }
                }
                alert("Settings updated successfully!");
                location.reload();
            };
        
            window.onload = loadSettings;
        </script>
</body>
</html>
