<!DOCTYPE html>
<html lang="en">
	<script type="application/ld+json">
		{
		"@context": "https://schema.org",
		"@type": "Review",
		"itemReviewed": {
			"@type": "CafeOrCoffeeShop",
			"name": "CGS Cafe"
		},
  		"logo": "https://cgscafe.in/images/cgs-logo.webp",
		"image": "https://cgscafe.in/images/cgs-preview.webp",
		"description": "CGS Cafe in Scheme No 59, Indore offering premium coffee, grill items, mocktail shots and refreshing beverages. A modern boutique cafe experience. Jumpstart Your Mood.",
		"address": {
			"@type": "PostalAddress",
			"streetAddress": "Scheme No 59",
			"addressLocality": "Indore",
			"addressRegion": "MP",
			"postalCode": "452012",
			"addressCountry": "IN"
		},
		"areaServed": {
			"@type": "City",
			"name": "Indore"
		},
		"geo": {
			"@type": "GeoCoordinates",
			"latitude": 22.6783187402986, 
			"longitude": 75.85015334973336
		},
		"telephone": "+91-8390540094",
		"openingHours": "Mo-Su 08:00-23:00",
		"servesCuisine": ["Cafe", "Coffee", "Fast Food", "Beverages"],
		"priceRange": "₹₹"
		}
	</script>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script>(function(){try{var t=localStorage.getItem('cgs-theme');if(t==='botanica')document.documentElement.setAttribute('data-theme','botanica');}catch(e){}})();</script>
		<link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
		<link rel="stylesheet" href="/fonts/local-fonts.css">
		<link rel="preconnect" href="https://gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="/css/theme.css">
		<meta name="theme-color" content="#1B1412">
		<meta name="google-site-verification" content="fd40eee476e539a8" />

		<title>Customer Reviews | CGS Cafe Indore</title>
		<meta name="description" content="Read customer reviews and experiences at CGS Cafe Indore.">
		<link rel="canonical" href="https://cgscafe.in/testimonials/">

		<meta property="og:title" content="CGS Cafe Reviews">
		<meta property="og:description" content="What our customers say about CGS Cafe.">
		<meta property="og:url" content="https://cgscafe.in/testimonials/">
		<meta property="og:image" content="https://cgscafe.in/images/cgs-preview.webp">

		<!-- Dependencies First -->
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
		<script src="../js/environment.js"></script>
		<script src="../js/supabase-config.js"></script>
		
		<!-- Global Scripts (Load these before admin.js so they are ready) -->
		<script src="../js/custom.js"></script>
		<script src="../js/components.js"></script> <!-- Updates the UI -->
		<script src="../js/animations.js"></script>
	</head>
	<body>
		<!-- Header Section -->
		<header id="header"></header>
		<section class="page-hero">
			<span class="eyebrow">In Their Words</span>
			<h1 class="page-hero__title">Testimonials</h1>
			<div class="divider"></div>
			<p class="page-hero__subtitle">Stories from those who've experienced CGS</p>
		</section>

		<section class="section" style="padding-top:0;">
			<div class="container" style="max-width:640px;">
				<div class="card card--plain text-center" style="padding:var(--space-8) var(--space-6);">
					<span style="font-size:2rem;color:var(--color-accent);display:block;margin-bottom:var(--space-4);">&#128172;</span>
					<h2 class="card__title" style="font-size:var(--text-lg);">We're Just Getting Started</h2>
					<p class="card__text">No customer testimonials are available yet. We look forward to sharing real experiences from our guests soon.</p>
				</div>
			</div>
			<!-- Design preview template for when real testimonials are ready:
			<div class="card-grid card-grid--2" style="max-width:900px;margin:var(--space-8) auto 0;">
				<div class="card">
					<div class="card__title">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
					<p class="card__text">"Quote from guest goes here."</p>
					<p class="card__text" style="margin-top:var(--space-3);font-weight:600;">&mdash; Guest Name</p>
				</div>
			</div>
			-->
		</section>
		<!-- Footer Section -->
		<footer class="site-footer" id="footer"></footer>
		<!-- Miscellaneous (Top-Bottom scrolling, WhatsApp Chat) -->
		<div id="preloader"></div>
	</body>
</html>
