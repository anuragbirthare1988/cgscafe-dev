                <script>
                        // Use the global 'supabase' provided by the script tag
                        const client = window.supabaseClient || supabaseClient;
                        
                        let globalCategories = [];
                        // Global display settings (loaded from Supabase app_settings)
                        let DISPLAY_SETTINGS = { showPrices: true, showQuantities: true };

                        // Load global display settings from Supabase 'app_settings'
                        async function loadDisplaySettings() {
                                try {
                                        const { data, error } = await client
                                                .from('app_settings')
                                                .select('setting_key, value')
                                                .in('setting_key', ['show_prices', 'show_quantities']);
                                        if (error) throw error;
                                        (data || []).forEach(row => {
                                                const raw = row.value;
                                                // Value may be boolean, string, or number. Anything explicitly "false"/0 is false.
                                                const isTrue = !(raw === false || raw === 'false' || raw === 0 || raw === '0' || raw === null);
                                                if (row.setting_key === 'show_prices')     DISPLAY_SETTINGS.showPrices = isTrue;
                                                if (row.setting_key === 'show_quantities') DISPLAY_SETTINGS.showQuantities = isTrue;
                                        });
                                } catch (err) {
                                        console.warn('Display settings fetch failed, using defaults:', err);
                                }
                        }

                        // Data Loading Function
                        async function loadDynamicMenu() {
                                try {
                                        if (typeof loadDisplaySettings === 'function') {
                                        await loadDisplaySettings();
                                        }
                                        
                                        // Fetch the structured menu directly from the normalized tables using our shared helper
                                        const dbData = await window.fetchMasterMenuFromDatabase();
                                        
                                        // Filter out hidden categories, hidden items, AND categories with 0 visible items left
                                        globalCategories = (dbData.categories || [])
                                        .filter(cat => {
                                                if (cat.hidden === true) return false;
                                                const visibleItems = (cat.items || []).filter(item => item.hidden !== true);
                                                return visibleItems.length > 0; // Drops the category if all its children are hidden
                                        })
                                        .map(cat => ({
                                                ...cat,
                                                items: (cat.items || []).filter(item => item.hidden !== true)
                                        }));

                                        renderCategories(globalCategories); 
                                } catch (err) {
                                        console.error("Menu fetch error:", err);
                                }
                        }

                        // Helper to generate HTML for a category block
                        function createCategoryHTML(cat) {
                                const showPrices = DISPLAY_SETTINGS.showPrices;
                                const showQty    = DISPLAY_SETTINGS.showQuantities;
                                return `
                                        <div class="menu-category">
                                                <div class="menu-category__header">
                                                        <div>
                                                                <h2 class="menu-category__title">${cat.subCategoryName}</h2>
                                                                <p class="menu-category__subtitle">${cat.subCategoryDesc || ''}</p>
                                                        </div>
                                                </div>
                                                ${cat.supplementNote ? `<p class="menu-category__note">${cat.supplementNote}</p>` : ''}
                                                <div class="menu-grid">
                                                        ${cat.items.map(item => `
                                                                <div class="menu-item ${item.featured ? 'menu-item--signature' : ''}">
                                                                        ${item.featured ? '<span class="menu-item__star">&#10022;</span>' : ''}
                                                                        <div class="menu-item__row">
                                                                                <h3 class="menu-item__name">${item.name}</h3>
                                                                        </div>
                                                                        <p class="menu-item__desc">${item.description || ''}</p>
                                                                        ${(showQty && item.qty) ? `<span class="menu-item__meta">${item.qty}</span>` : ''}
                                                                        ${(showPrices && item.price) ? `<span class="menu-item__meta">${item.price}</span>` : ''}
                                                                </div>
                                                        `).join('')}
                                                </div>
                                        </div>
                                `;
                        }

                        // Rendering Function
                        function renderCategories(categories) {
                                const allTarget = document.getElementById('tab-all');
                                const bevTarget = document.getElementById('tab-beverages');
                                const bitesTarget = document.getElementById('tab-bites');

                                // Clear existing content
                                if (allTarget) allTarget.innerHTML = '';
                                if (bevTarget) bevTarget.innerHTML = '';
                                if (bitesTarget) bitesTarget.innerHTML = '';
                        
                                categories.forEach(cat => {
                                        const isBeverage = cat.originType === 'beverages';
                                        const categoryHTML = createCategoryHTML(cat);

                                        // Append to "All" tab container
                                        if (allTarget) {
                                                allTarget.insertAdjacentHTML('beforeend', categoryHTML);
                                        }

                                        // Append to specific target tab container
                                        const specificTarget = isBeverage ? bevTarget : bitesTarget;
                                        if (specificTarget) {
                                                specificTarget.insertAdjacentHTML('beforeend', categoryHTML);
                                        }
                                });
                        }

                        // Initialize
                        window.addEventListener("DOMContentLoaded", loadDynamicMenu);
                </script>
