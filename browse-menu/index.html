<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CGS | Browse Menu</title>
    <!-- Add your existing CSS links here -->
</head>
<body>

    <!-- Main Navigation/Header -->
    <header>
        <h1>Coffee Grill & Shots</h1>
        <p>Jumpstart Your Mood</p>
    </header>

    <!-- Tabbed Menu Structure -->
    <div class="tabs">
        <button class="tab-link active" onclick="openTab(event, 'tab-beverages')">Beverages</button>
        <button class="tab-link" onclick="openTab(event, 'tab-bites')">Bites</button>
    </div>

    <div class="tab-content active" id="tab-beverages">
        <div id="render-beverages"></div>
    </div>

    <div class="tab-content" id="tab-bites">
        <div id="render-bites"></div>
    </div>

    <!-- Load Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>

    <script>
        async function fetchAndRenderMenu() {
            try {
                // Fetch from Supabase
                const { data, error } = await defaultSupabaseClient
                    .from("live_menu")
                    .select("*")
                    .single();
                
                if (error) throw error;

                const menu = data.menu_json.categories;
                renderMenu(menu);
            } catch (err) {
                console.error("Error loading menu:", err);
            }
        }

        function renderMenu(categories) {
            const bevTarget = document.getElementById("render-beverages");
            const bitesTarget = document.getElementById("render-bites");

            // Clear previous content
            bevTarget.innerHTML = '';
            bitesTarget.innerHTML = '';

            categories.forEach(cat => {
                const container = cat.originType === 'beverages' ? bevTarget : bitesTarget;
                
                const section = document.createElement("div");
                section.className = "reveal menuDishHeader";
                section.innerHTML = `
                    <div class="flex items-center gap-4 mb-3">
                        <h2 class="category-name text-3xl md:text-4xl">${cat.subCategoryName}</h2>
                    </div>
                    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${cat.items.map(item => `
                            <div class="reveal group menu-item ${item.featured ? 'signature-block' : 'regular-block'}">
                                <h3 class="font-montserrat font-bold">${item.name}</h3>
                                <p>${item.description}</p>
                                <span>${item.price}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(section);
            });
        }

        // Initialize on load
        window.addEventListener("load", fetchAndRenderMenu);
    </script>
</body>
</html>
