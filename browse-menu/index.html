<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGS - Coffee Grill & Shots</title>
    <!-- Load Supabase Client from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; line-height: 1.6; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        .menu-item { border-bottom: 1px solid #eee; padding: 15px 0; }
        .menu-item h3 { margin: 0; color: #000; }
        .price { font-weight: bold; color: #d35400; }
        #menu-container { max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>

    <header>
        <h1>CGS - Jumpstart Your Mood</h1>
    </header>

    <main id="menu-container">
        <p>Loading menu...</p>
    </main>

    <script>
        // Configuration
        const SUPABASE_URL = 'https://aastenbsntpdxknonyyr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhc3RlbmJzbnRwZHhrbm9ueXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMjk4MTEsImV4cCI6MjA5NzgwNTgxMX0.C0lfo9Xawq5jvDetw1V-fozdr2jkfwB2Ulk3JMyBhps';
        
        // Rename 'supabase' to 'cgsClient' to avoid conflict with the library
        const cgsClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadMenu() {
            const container = document.getElementById('menu-container');
            
            try {
                // Use 'cgsClient' to fetch from 'products' table
                const { data, error } = await cgsClient
                    .from('products')
                    .select('*');

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p>No items found.</p>';
                    return;
                }

                // Rendering items
                container.innerHTML = data.map(item => `
                    <div class="menu-item">
                        <h3>${item.name}</h3>
                        <p>${item.description || ''}</p>
                        <p class="price">₹${item.price}</p>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Error loading menu:', err.message);
                container.innerHTML = '<p>Unable to load the menu at this moment.</p>';
            }
        }

        // Initialize on load
        loadMenu();
    </script>
</body>
</html>
