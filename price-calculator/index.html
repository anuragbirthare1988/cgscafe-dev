<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts CDN links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Yield Cost Calculator</title>
    
    <style>
        :root {
            --bg-outer: #f4eae1;      /* Light cream outer background */
            --bg-card: #282220;        /* Deep charcoal/brown card background */
            --text-gold: #dabba0;      /* Muted beige/gold headings inside card */
            --brand-orange: #d17533;   /* Accent orange for live pricing */
            --input-bg: #1e1917;       /* Darker inset input fields */
            --input-border: #3a3230;   /* Subtle divider border */
            --text-muted: #8c827a;     /* Subtitles and units */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-outer);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }

        /* Hide up/down spinner arrows for Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Hide up/down spinner arrows for Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }

        .calc-container {
            width: 100%;
            max-width: 460px;
        }

        .calc-header {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        /* Highlighted Page Title */
        .calc-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: #382c27; /* Rich, dark espresso tone for strong contrast on light background */
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .compact-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .inputs-row {
            display: flex;
            flex-direction: row;
            gap: 1.0rem;
        }

        .field-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .compact-label {
            color: var(--text-gold);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 500;
        }

        .compact-control {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #ffffff;
            padding: 0.65rem 0.85rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
            transition: border-color 0.2s ease;
        }

        .compact-control:focus {
            outline: none;
            border-color: var(--brand-orange);
        }

        .compact-control::placeholder {
            color: #4a403c;
        }

        .outputs-container {
            display: flex;
            width: 100%;
            gap: 1rem;
            border-top: 1px solid var(--input-border);
            padding-top: 1rem;
        }

        .output-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .output-box.with-border {
            border-right: 1px solid var(--input-border);
            padding-right: 1rem;
        }

        .output-label {
            color: var(--text-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.1rem;
        }

        .output-price {
            font-size: 2.0rem;
            font-weight: 600;
            color: var(--brand-orange);
            white-space: nowrap;
        }

        .output-price.primary {
            font-size: 2.2rem;
        }

        .output-unit {
            font-size: 0.9rem;
            color: #ffffff;
            font-weight: 300;
        }

        @media (max-width: 380px) {
            .inputs-row {
                flex-direction: column;
                gap: 1rem;
            }
            .outputs-container {
                flex-direction: column;
                gap: 1rem;
            }
            .output-box.with-border {
                border-right: none;
                padding-right: 0;
                border-bottom: 1px solid var(--input-border);
                padding-bottom: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="calc-container">
        <div class="calc-header">
            <h1 class="calc-title">Yield Cost Calculator</h1>
        </div>

        <div class="compact-card">
            
            <!-- ROW 1: Pack Price & Size in Grams -->
            <div class="inputs-row">
                <div class="field-group">
                    <label class="compact-label">Pack Price (₹)</label>
                    <input type="number" step="0.01" id="packPrice" class="compact-control" placeholder="e.g. 36" oninput="runLiveCalc()">
                </div>

                <div class="field-group">
                    <label class="compact-label">Pack Size (g / ml)</label>
                    <input type="number" step="any" id="packYield" class="compact-control" placeholder="e.g. 500" oninput="runLiveCalc()">
                </div>
            </div>

            <!-- ROW 2: Optional Single Serve Input in Grams -->
            <div class="inputs-row">
                <div class="field-group">
                    <label class="compact-label">Single Serve Qty (g / ml) <span style="font-weight: 300; text-transform: none; color: var(--text-muted);">(Optional)</span></label>
                    <input type="number" step="any" id="serveQty" class="compact-control" placeholder="e.g. 15" oninput="runLiveCalc()">
                </div>
            </div>

            <!-- OUTPUT SECTION -->
            <div class="outputs-container" id="outputWrapper">
                <div class="output-box" id="baseRateBox">
                    <div class="output-label">Calculated Rate</div>
                    <div class="output-price primary">
                        ₹<span id="rateOutput">0.00</span><span class="output-unit"> /kg or L</span>
                    </div>
                </div>

                <div class="output-box" id="serveCostBox" style="display: none;">
                    <div class="output-label">Single Serve Cost</div>
                    <div class="output-price">
                        ₹<span id="serveOutput">0.00</span><span class="output-unit"> /serve</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Live Math Calculation Logic -->
    <script>
        function runLiveCalc() {
            const rawPrice = document.getElementById('packPrice').value;
            const rawSize = document.getElementById('packYield').value;
            const rawServe = document.getElementById('serveQty').value;
            
            const rateDisplay = document.getElementById('rateOutput');
            const serveDisplay = document.getElementById('serveOutput');
            const serveCostBox = document.getElementById('serveCostBox');
            const baseRateBox = document.getElementById('baseRateBox');

            const validatedPrice = parseFloat(rawPrice);
            const validatedSize = parseFloat(rawSize);
            const validatedServe = parseFloat(rawServe);

            if (isNaN(validatedPrice) || isNaN(validatedSize) || validatedSize <= 0) {
                rateDisplay.innerText = "0.00";
                serveCostBox.style.display = "none";
                baseRateBox.classList.remove('with-border');
                return;
            }

            const calculationResult = validatedPrice / (validatedSize / 1000);

            rateDisplay.innerText = calculationResult.toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            if (!isNaN(validatedServe) && validatedServe > 0) {
                const serveCostResult = (validatedPrice / validatedSize) * validatedServe;
                
                serveDisplay.innerText = serveCostResult.toLocaleString('en-IN', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

                serveCostBox.style.display = "flex";
                baseRateBox.classList.add('with-border');
            } else {
                serveCostBox.style.display = "none";
                baseRateBox.classList.remove('with-border');
            }
        }
    </script>

</body>
</html>
